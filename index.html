<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Vault — Earn Free Crypto</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.85);
            --bright-border: #ff6b00;
            --accent-orange: #ff6b00;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --btn-grad: linear-gradient(135deg, #ff6b00 0%, #d97706 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 60px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(255, 107, 0, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 60%, rgba(56, 189, 248, 0.08) 0%, transparent 45%);
        }

        /* Header */
        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 107, 0, 0.15);
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 107, 0, 0.3);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header h1 span {
            background: linear-gradient(90deg, #ff6b00, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        /* Main Layout */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 45px;
        }

        /* Section Styling & Auto-hide */
        .faucet-section {
            display: none;
        }

        .faucet-section.active {
            display: block;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            color: #ffffff;
        }

        .section-title span {
            color: var(--accent-orange);
        }

        /* Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--bright-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #ff8533;
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.45);
        }

        /* Приглушенная серая шапка карточки */
        .card-header-grey {
            background: #1e293b;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 107, 0, 0.15);
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
        }

        .brand-logo-img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--bright-border);
        }

        .brand-text h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.2;
        }

        .brand-text span {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .capsule-tag-grey {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .profit-banner {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 10px;
            border: 1px solid rgba(255, 107, 0, 0.2);
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 0.82rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-bullets {
            list-style: none;
            margin-bottom: 22px;
        }

        .feature-bullets li {
            font-size: 0.88rem;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-bullets li::before {
            content: "•";
            color: var(--accent-orange);
            font-size: 1.2rem;
            line-height: 0;
        }

        .card-bottom {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 107, 0, 0.2);
        }

        .payout-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .payout-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .wallet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn-wallet {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-wallet:hover {
            background: rgba(255, 107, 0, 0.2);
            border-color: var(--accent-orange);
            color: #ffffff;
        }

        .btn-claim {
            background: var(--btn-grad);
            color: #ffffff;
            text-decoration: none;
            padding: 11px 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.35);
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-claim:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>

        function renderCards() {
            const newGrid = document.getElementById('new-grid');
            const trustedGrid = document.getElementById('trusted-grid');

            let trustedCount = 0;

            faucetsData.forEach(faucet => {

                    `<a href="${w.url}" target="_blank" rel="noopener" class="btn-wallet">${w.title} ↗</a>`
                ).join('');

                    `<li>${b}</li>`
                ).join('');

                // Иконка: логотип или буквенный аватар

                    ? `<img src="${faucet.iconImg}" alt="${faucet.name}" class="brand-logo-img">`
                    : `<div class="brand-icon">${faucet.iconText}</div>`;

                // Полная верстка карточки

                    <div class="card">
                        <div class="card-header-grey">
                            <div class="brand-info">
                                ${iconHTML}
                                <div class="brand-text">
                                    <h3>${faucet.name}</h3>
                                    <span>${faucet.category}</span>
                                </div>
                            </div>
                            <span class="capsule-tag-grey">${faucet.tag}</span>
                        </div>

                        <div class="card-body">

                            </div>

                            </div>
                        </div>
                    </div>
                `;

                // Вставка в нужный блок
                if (faucet.type === 'new') {
                    newGrid.innerHTML += cardHTML;
                    newCount++;
                } else {
                    trustedGrid.innerHTML += cardHTML;
                    trustedCount++;
                }
            });

            // Показываем раздел только если в нем есть хоть 1 кран
            if (newCount > 0) document.getElementById('new-section').classList.add('active');
            if (trustedCount > 0) document.getElementById('trusted-section').classList.add('active');
        }

        // Запуск генерации при загрузке страницы
        document.addEventListener('DOMContentLoaded', renderCards);
